<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GPS Speedometer · E-Bike Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0b0f14;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 12px;
        }
        .dashboard {
            background: #1a1e26;
            border-radius: 60px 60px 40px 40px;
            padding: 28px 24px 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 1px 4px rgba(255,255,255,0.08);
            border: 1px solid #3a404c;
            max-width: 500px; width: 100%;
        }
        .speedo-wrapper { position: relative; display: flex; justify-content: center; margin-bottom: 8px; }
        canvas {
            width: 100%; height: auto; display: block; border-radius: 50%;
            filter: drop-shadow(0 12px 18px #00000080); background: #0e1217;
        }
        .speed-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -55%);
            font-size: 4.8rem; font-weight: 800; color: #f5f9ff;
            text-shadow: 0 0 20px #4aaaff, 0 0 8px #1e90ff;
            letter-spacing: 4px; font-variant-numeric: tabular-nums; line-height: 1;
        }
        .unit {
            position: absolute; bottom: 22%; left: 50%; transform: translateX(-50%);
            color: #9aaec9; font-size: 1rem; font-weight: 500; letter-spacing: 3px;
            text-transform: uppercase; background: #0b0f14cc; padding: 4px 14px;
            border-radius: 40px; backdrop-filter: blur(4px); border: 1px solid #2f3a4b;
        }
        .gps-status {
            text-align: center; color: #7e8b9f; font-size: 0.9rem; margin-top: 8px;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            background: #0d1219; padding: 8px 16px; border-radius: 60px;
            border: 1px solid #2a323f; width: fit-content;
            margin-left: auto; margin-right: auto;
        }
        .dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: #4caf50; box-shadow: 0 0 10px #4caf50; transition: 0.3s;
        }
        .dot.inactive { background: #f44336; box-shadow: 0 0 10px #f44336; }
        .controls { display: flex; justify-content: center; gap: 16px; margin-top: 24px; flex-wrap: wrap; }
        button {
            background: #222a35; border: none; border-radius: 50px;
            padding: 14px 32px; font-size: 1rem; font-weight: 600; color: #d3e2ff;
            letter-spacing: 1px; cursor: pointer;
            box-shadow: 0 6px 0 #0b0f14, 0 8px 20px #00000080;
            transition: 0.07s ease; border: 1px solid #3e4b5e;
            display: flex; align-items: center; gap: 10px;
        }
        button:active { transform: translateY(5px); box-shadow: 0 2px 0 #0b0f14, 0 8px 20px #00000080; }
        button:disabled { opacity: 0.45; transform: translateY(3px); box-shadow: 0 3px 0 #0b0f14, 0 8px 20px #00000080; pointer-events: none; }
        .sound-indicator {
            display: flex; align-items: center; gap: 6px; color: #b7c9e0;
            font-size: 0.85rem; background: #0d1219; padding: 6px 16px;
            border-radius: 40px; border: 1px solid #2d3746; margin-left: 8px;
        }
        .sound-icon { font-size: 1.2rem; }
        .footer-note { text-align: center; color: #4a576b; font-size: 0.7rem; margin-top: 18px; letter-spacing: 0.5px; }

        .rev-btn {
            background: linear-gradient(180deg, #ff7a2f 0%, #d43d00 100%);
            border: 1px solid #ffb07a;
            color: #fff3e6;
            font-size: 1.15rem;
            padding: 16px 38px;
            letter-spacing: 2px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.4);
            box-shadow: 0 6px 0 #7a1f00, 0 8px 22px #ff450080;
        }
        .rev-btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #7a1f00, 0 6px 18px #ff450080;
        }
        .rev-btn.revving { animation: revPulse 0.12s ease-in-out infinite alternate; }
        @keyframes revPulse { from { filter: brightness(1); } to { filter: brightness(1.5); } }

        /* calibration badge */
        .calib {
            text-align: center; margin-top: 12px; font-size: 0.72rem;
            color: #6b7f99; letter-spacing: 1px;
        }
        .calib span { color: #ffa640; font-weight: 700; }

        @media (max-width: 420px) {
            .speed-text { font-size: 3.6rem; }
            button { padding: 12px 20px; font-size: 0.9rem; }
            .rev-btn { padding: 14px 28px; }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="speedo-wrapper">
            <canvas id="speedoCanvas" width="800" height="800"></canvas>
            <div class="speed-text" id="speedDisplay">0</div>
            <div class="unit">km/h</div>
        </div>
        <div class="gps-status" id="gpsStatus">
            <span class="dot" id="gpsDot"></span>
            <span id="gpsMessage">GPS idle</span>
        </div>
        <div class="controls">
            <button id="startBtn" title="Start GPS tracking">▶ START</button>
            <button id="stopBtn" disabled title="Stop GPS">⏹ STOP</button>
            <button id="revBtn" class="rev-btn" title="Blip the throttle">🔊 REV</button>
        </div>
        <div class="sound-indicator" id="soundIndicator">
            <span class="sound-icon">🏍️</span>
            <span id="soundText">Big bike: OFF</span>
        </div>
        <div class="calib">GAUGE MAX <span>60 km/h</span> · SOUND REDLINE <span>40 km/h</span></div>
        <div class="footer-note">GPS speedometer · e-bike calibrated · REV to blip throttle</div>
    </div>

    <script>
    (function() {
        // ============================================================
        //  ★ CALIBRATION — TUNED FOR A 40 km/h E-BIKE ★
        // ============================================================
        const MAX_GAUGE_SPEED = 60;    // gauge dial top (km/h) — 40 sits at 2/3
        const MAX_SOUND_SPEED = 40;    // speed where engine hits redline / full roar
        const MAX_GPS_SPEED   = 60;    // clamp readings above this (noise filter)
        // ============================================================

        const canvas = document.getElementById('speedoCanvas');
        const ctx = canvas.getContext('2d');
        const speedDisplay = document.getElementById('speedDisplay');
        const gpsDot = document.getElementById('gpsDot');
        const gpsMessage = document.getElementById('gpsMessage');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const revBtn = document.getElementById('revBtn');
        const soundText = document.getElementById('soundText');
        const SIZE = 800;
        canvas.width = SIZE;
        canvas.height = SIZE;

        let currentSpeed = 0;
        let targetSpeed = 0;
        let animationFrame = null;

        let watchId = null;
        let isTracking = false;
        let lastPosition = null;
        let lastUpdateTime = 0;

        let revEnergy = 0;
        let isRevving = false;

        const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

        // ===== AUDIO =====
        let audioCtx = null;
        let masterGain = null;
        let engineBus = null;
        let noiseSource = null;
        let noiseFilter = null;
        let noiseGain = null;
        let lfo = null;
        let lfoGain = null;
        let lfoGainTarget = null;
        let oscillators = [];
        let filterNode = null;
        let isAudioReady = false;

        function initAudio() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                masterGain = audioCtx.createGain();
                masterGain.gain.value = 0;
                masterGain.connect(audioCtx.destination);

                filterNode = audioCtx.createBiquadFilter();
                filterNode.type = 'lowpass';
                filterNode.frequency.value = 1200;
                filterNode.Q.value = 0.9;
                filterNode.connect(masterGain);

                engineBus = audioCtx.createGain();
                engineBus.gain.value = 0.9;
                engineBus.connect(filterNode);

                // Layer 1: fundamental saw
                const osc1 = audioCtx.createOscillator();
                osc1.type = 'sawtooth';
                osc1.frequency.value = 55;
                const g1 = audioCtx.createGain();
                g1.gain.value = 0.5;
                osc1.connect(g1); g1.connect(engineBus); osc1.start();
                oscillators.push({ osc: osc1, baseFreq: 55 });

                // Layer 2: sub-octave sine (thump)
                const osc2 = audioCtx.createOscillator();
                osc2.type = 'sine';
                osc2.frequency.value = 27.5;
                const g2 = audioCtx.createGain();
                g2.gain.value = 0.7;
                osc2.connect(g2); g2.connect(engineBus); osc2.start();
                oscillators.push({ osc: osc2, baseFreq: 27.5 });

                // Layer 3: second harmonic (growl)
                const osc3 = audioCtx.createOscillator();
                osc3.type = 'sawtooth';
                osc3.frequency.value = 110;
                const g3 = audioCtx.createGain();
                g3.gain.value = 0.18;
                osc3.connect(g3); g3.connect(engineBus); osc3.start();
                oscillators.push({ osc: osc3, baseFreq: 110 });

                // Layer 4: detuned saw (beating)
                const osc4 = audioCtx.createOscillator();
                osc4.type = 'sawtooth';
                osc4.frequency.value = 55;
                osc4.detune.value = 12;
                const g4 = audioCtx.createGain();
                g4.gain.value = 0.22;
                osc4.connect(g4); g4.connect(engineBus); osc4.start();
                oscillators.push({ osc: osc4, baseFreq: 55 });

                // Layer 5: exhaust rasp (noise)
                const bufferSize = 2 * audioCtx.sampleRate;
                const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                noiseSource = audioCtx.createBufferSource();
                noiseSource.buffer = noiseBuffer;
                noiseSource.loop = true;

                noiseFilter = audioCtx.createBiquadFilter();
                noiseFilter.type = 'bandpass';
                noiseFilter.frequency.value = 180;
                noiseFilter.Q.value = 0.7;

                noiseGain = audioCtx.createGain();
                noiseGain.gain.value = 0.18;

                noiseSource.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(engineBus);
                noiseSource.start();

                // LFO for V-twin lope
                lfo = audioCtx.createOscillator();
                lfo.type = 'sine';
                lfo.frequency.value = 7;

                lfoGain = audioCtx.createGain();
                lfoGain.gain.value = 0.35;

                lfoGainTarget = audioCtx.createGain();
                lfoGainTarget.gain.value = 0.65;

                lfo.connect(lfoGain);
                lfoGain.connect(lfoGainTarget.gain);
                lfo.start();

                engineBus.disconnect();
                engineBus.connect(lfoGainTarget);
                lfoGainTarget.connect(filterNode);

                isAudioReady = true;
            } catch (e) {
                console.warn('Audio init failed:', e);
            }
        }

        function startRev() {
            if (!isAudioReady) {
                initAudio();
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
            }
            isRevving = true;
            revBtn.classList.add('revving');
        }
        function stopRev() {
            isRevving = false;
            revBtn.classList.remove('revving');
        }

        // ===== SOUND (calibrated to 40 km/h redline) =====
        function updateBigBikeSound(speedKmh) {
            if (!audioCtx || !isAudioReady) return;
            if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});

            const now = audioCtx.currentTime;

            if (isRevving) revEnergy = Math.min(1, revEnergy + 0.08);
            else { revEnergy *= 0.94; if (revEnergy < 0.005) revEnergy = 0; }

            // ★ Speed normalized against 40 km/h (not 120) ★
            const speedNorm = clamp(speedKmh / MAX_SOUND_SPEED, 0, 1);
            const load = clamp(speedNorm + revEnergy * 0.9, 0, 1);

            // Volume
            const idlePresence = 0.07;
            const volume = idlePresence + (1 - idlePresence) * Math.pow(load, 0.8);
            masterGain.gain.setTargetAtTime(volume * 0.55, now, 0.06);

            // Pitch: 1x idle → 3x at 40 km/h, extra kick from rev
            const revFactor = 1 + load * 2.0 + revEnergy * 0.8;
            oscillators.forEach(o => {
                o.osc.frequency.setTargetAtTime(o.baseFreq * revFactor, now, 0.04);
            });

            // Filter opens with load
            const cutoff = 350 + load * 2600 + revEnergy * 800;
            filterNode.frequency.setTargetAtTime(cutoff, now, 0.05);

            // Exhaust rasp
            noiseGain.gain.setTargetAtTime(0.08 + load * 0.22 + revEnergy * 0.1, now, 0.06);
            noiseFilter.frequency.setTargetAtTime(140 + load * 900 + revEnergy * 400, now, 0.06);

            // LFO lope
            lfo.frequency.setTargetAtTime(7 + load * 18 + revEnergy * 10, now, 0.08);
            lfoGain.gain.setTargetAtTime(0.35 * (1 - load * 0.7), now, 0.08);

            if (revEnergy > 0.15) soundText.innerText = 'Big bike: REVVING';
            else if (speedKmh > 1) soundText.innerText = 'Big bike: ROAR';
            else if (isRevving || revEnergy > 0.01) soundText.innerText = 'Big bike: blip';
            else soundText.innerText = 'Big bike: idle';
        }

        function stopAudio() {
            if (!audioCtx) return;
            masterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.15);
            revEnergy = 0;
            soundText.innerText = 'Big bike: OFF';
        }

        // ===== GAUGE (max 60 km/h) =====
        function drawSpeedometer(speed) {
            const w = canvas.width, h = canvas.height;
            const centerX = w / 2, centerY = h / 2, radius = w * 0.42;
            ctx.clearRect(0, 0, w, h);

            ctx.beginPath();
            ctx.arc(centerX, centerY, radius + 18, 0, Math.PI * 2);
            ctx.fillStyle = '#0e1217'; ctx.fill();
            ctx.shadowColor = '#000'; ctx.shadowBlur = 20;
            ctx.strokeStyle = '#2e3b4e'; ctx.lineWidth = 6; ctx.stroke();
            ctx.shadowBlur = 0;

            const gradient = ctx.createRadialGradient(centerX, centerY, radius * 0.2, centerX, centerY, radius);
            gradient.addColorStop(0, '#121a24');
            gradient.addColorStop(0.9, '#0a0f14');
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fillStyle = gradient; ctx.fill();
            ctx.strokeStyle = '#2b3f5c'; ctx.lineWidth = 3; ctx.stroke();

            const startAngle = Math.PI * 0.75;
            const endAngle = Math.PI * 2.25;
            const angleRange = endAngle - startAngle;

            // ★ Ticks now use MAX_GAUGE_SPEED = 60 ★
            const majorStep = 10;                 // 10, 20, 30, 40, 50, 60
            const totalMajor = MAX_GAUGE_SPEED / majorStep;
            const minorStep = 2;                  // small ticks every 2 km/h
            const totalMinor = MAX_GAUGE_SPEED / minorStep;

            for (let i = 0; i <= totalMinor; i++) {
                const value = i * minorStep;
                if (value > MAX_GAUGE_SPEED) continue;
                const angle = startAngle + (value / MAX_GAUGE_SPEED) * angleRange;
                const innerR = radius * 0.82, outerR = radius * 0.9;
                const x1 = centerX + Math.cos(angle) * innerR;
                const y1 = centerY + Math.sin(angle) * innerR;
                const x2 = centerX + Math.cos(angle) * outerR;
                const y2 = centerY + Math.sin(angle) * outerR;
                ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
                ctx.strokeStyle = '#5d7b9e';
                ctx.lineWidth = (i % 5 === 0) ? 2 : 1;   // every 10 km/h thicker
                ctx.stroke();
            }

            for (let i = 0; i <= totalMajor; i++) {
                const value = i * majorStep;
                if (value > MAX_GAUGE_SPEED) continue;
                const angle = startAngle + (value / MAX_GAUGE_SPEED) * angleRange;
                const innerR = radius * 0.75, outerR = radius * 0.92;
                const x1 = centerX + Math.cos(angle) * innerR;
                const y1 = centerY + Math.sin(angle) * innerR;
                const x2 = centerX + Math.cos(angle) * outerR;
                const y2 = centerY + Math.sin(angle) * outerR;
                ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);

                // ★ Red zone starts at 40 km/h (your e-bike max) ★
                ctx.strokeStyle = (value >= MAX_SOUND_SPEED) ? '#ff5544' : '#b8d0ee';
                ctx.lineWidth = 4;
                ctx.stroke();

                const labelR = radius * 0.6;
                const lx = centerX + Math.cos(angle) * labelR;
                const ly = centerY + Math.sin(angle) * labelR;
                ctx.font = 'bold 32px "Segoe UI", Roboto, sans-serif';
                ctx.fillStyle = (value >= MAX_SOUND_SPEED) ? '#ff8877' : '#d0e2ff';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.shadowColor = (value >= MAX_SOUND_SPEED) ? '#ff3300' : '#1e90ff';
                ctx.shadowBlur = 8;
                ctx.fillText(value, lx, ly);
                ctx.shadowBlur = 0;
            }

            // needle — normalized to MAX_GAUGE_SPEED (60)
            const speedRatio = clamp(speed / MAX_GAUGE_SPEED, 0, 1);
            const needleAngle = startAngle + speedRatio * angleRange;

            ctx.shadowColor = '#1e90ff'; ctx.shadowBlur = 22;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            const needleLen = radius * 0.7;
            const tipX = centerX + Math.cos(needleAngle) * needleLen;
            const tipY = centerY + Math.sin(needleAngle) * needleLen;
            ctx.lineTo(tipX, tipY);
            ctx.lineWidth = 10; ctx.strokeStyle = '#f0f8ff'; ctx.stroke();

            ctx.shadowBlur = 16; ctx.shadowColor = '#ff5500';
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(tipX, tipY);
            ctx.lineWidth = 6; ctx.strokeStyle = '#ff8c42'; ctx.stroke();

            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 18, 0, Math.PI * 2);
            ctx.fillStyle = '#223344'; ctx.fill();
            ctx.strokeStyle = '#aaccff'; ctx.lineWidth = 4; ctx.stroke();
            ctx.shadowBlur = 0;

            // small "40 MAX" marker ring at your e-bike limit
            const maxAngle = startAngle + (MAX_SOUND_SPEED / MAX_GAUGE_SPEED) * angleRange;
            const mr = radius * 0.68;
            const mx = centerX + Math.cos(maxAngle) * mr;
            const my = centerY + Math.sin(maxAngle) * mr;
            ctx.beginPath();
            ctx.arc(mx, my, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#ff7755';
            ctx.shadowColor = '#ff3300'; ctx.shadowBlur = 12;
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function animate() {
            const diff = targetSpeed - currentSpeed;
            if (Math.abs(diff) > 0.1) currentSpeed += diff * 0.12;
            else currentSpeed = targetSpeed;
            if (currentSpeed < 0.1) currentSpeed = 0;

            speedDisplay.textContent = Math.round(currentSpeed);
            updateBigBikeSound(currentSpeed);
            drawSpeedometer(currentSpeed);
            animationFrame = requestAnimationFrame(animate);
        }

        function handlePosition(position) {
            if (!isTracking) return;
            const { speed, coords } = position;
            let speedKmh = 0;
            if (speed !== null && speed !== undefined && !isNaN(speed)) {
                speedKmh = speed * 3.6;
            } else if (lastPosition) {
                const lat1 = lastPosition.coords.latitude;
                const lon1 = lastPosition.coords.longitude;
                const lat2 = coords.latitude;
                const lon2 = coords.longitude;
                const R = 6371e3;
                const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
                const Δφ = (lat2 - lat1) * Math.PI / 180;
                const Δλ = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                const distance = R * c;
                const timeDiff = (performance.now() - lastUpdateTime) / 1000;
                if (timeDiff > 0.3 && distance > 1) speedKmh = (distance / timeDiff) * 3.6;
            }
            speedKmh = clamp(speedKmh, 0, MAX_GPS_SPEED);
            targetSpeed = speedKmh;
            lastPosition = position;
            lastUpdateTime = performance.now();
            gpsDot.className = 'dot';
            gpsMessage.textContent = `GPS active · ${coords.accuracy ? '±' + Math.round(coords.accuracy) + 'm' : 'signal ok'}`;
        }

        function handleGpsError(err) {
            gpsDot.className = 'dot inactive';
            let msg = 'GPS error';
            if (err.code === 1) msg = 'Permission denied';
            else if (err.code === 2) msg = 'Position unavailable';
            else if (err.code === 3) msg = 'Timeout';
            gpsMessage.textContent = msg;
        }

        function startTracking() {
            if (isTracking) return;
            if (!navigator.geolocation) {
                gpsMessage.textContent = 'Geolocation not supported';
                gpsDot.className = 'dot inactive';
                return;
            }
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});

            isTracking = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;
            gpsDot.className = 'dot';
            gpsMessage.textContent = 'Requesting GPS...';
            targetSpeed = 0; currentSpeed = 0;

            watchId = navigator.geolocation.watchPosition(
                handlePosition, handleGpsError,
                { enableHighAccuracy: true, maximumAge: 500, timeout: 12000 }
            );
        }

        function stopTracking() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            isTracking = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            targetSpeed = 0; currentSpeed = 0;
            gpsDot.className = 'dot inactive';
            gpsMessage.textContent = 'GPS stopped';
            stopAudio();
        }

        function init() {
            drawSpeedometer(0);
            animate();
            startBtn.addEventListener('click', startTracking);
            stopBtn.addEventListener('click', stopTracking);

            revBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); startRev(); });
            revBtn.addEventListener('pointerup', stopRev);
            revBtn.addEventListener('pointerleave', stopRev);
            revBtn.addEventListener('pointercancel', stopRev);

            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space' && !e.repeat) { e.preventDefault(); startRev(); }
            });
            window.addEventListener('keyup', (e) => {
                if (e.code === 'Space') { e.preventDefault(); stopRev(); }
            });

            window.addEventListener('beforeunload', () => {
                if (watchId !== null) navigator.geolocation.clearWatch(watchId);
                if (audioCtx) audioCtx.close().catch(() => {});
            });
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    if (audioCtx && audioCtx.state === 'running') audioCtx.suspend().catch(() => {});
                } else {
                    if (audioCtx && audioCtx.state === 'suspended' && isTracking) audioCtx.resume().catch(() => {});
                }
            });
        }
        init();
    })();
    </script>
</body>
</html>
